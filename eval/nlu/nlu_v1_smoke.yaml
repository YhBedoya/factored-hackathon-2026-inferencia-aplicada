# Smoke set for `nlu@v1` (D18, B4). 20 hand-written, invented messages: no
# real-looking PII (no full card numbers, no documents, no emails) and no
# customer id in any message. `country` and `pending` feed `run_nlu`'s
# context; `expected` is compared field-by-field against the `NLUResult`
# `run_nlu` returns, and is itself validated as an `NLUResult` shape.
#
# Entries `eod-1..eod-4` are the 4 end-of-day utterances from `07` D1 step 4,
# verbatim. This file is not a CI test (D18): run it through
# `backend/scripts/nlu_smoke.py`.

- id: eod-1
  text: "hola, ¿cuál es el estado de mi tarjeta?"
  country: MX
  note: "07 D1 end-of-day step 4, utterance 1 (verbatim)"
  expected:
    language: es
    intents: [card_status]
    status: clear

- id: eod-2
  text: "qual é o status do meu cartão?"
  country: null
  note: "07 D1 end-of-day step 4, utterance 2 (verbatim), PT-BR"
  expected:
    language: pt
    intents: [card_status]
    status: clear

- id: eod-3
  text: "¿me podés decir si mi tarjeta está activa?"
  country: AR
  note: "07 D1 end-of-day step 4, utterance 3 (verbatim), voseo"
  expected:
    language: es
    intents: [card_status]
    status: clear

- id: eod-4
  text: "quiero pagar con Pix"
  country: null
  note: "07 D1 end-of-day step 4, utterance 4 (verbatim)"
  expected:
    language: es
    intents: []
    status: out_of_market
    slots:
      topic: pix_boleto

