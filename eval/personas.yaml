# B1/D19: ~10 real customer IDs picked from local `data/` with traits only
# (country, card count, card kinds, whether any card is blocked). No names,
# documents, emails, phones, addresses, card numbers or balances (R10) --
# those columns are never queried past the aggregate counts used to choose
# these IDs, and never appear below.
#
# T9/D20: `customer_id` and `notes` aren't traits. Every other key below is
# part of a **closed** vocabulary -- `test_personas_match_golden` fails on
# any key it doesn't recognize -- and each one's SQL meaning, checked against
# `latam_golden`, is:
#   country                  bank.customers.country, mapped
#                             'México'->MX, 'Colombia'->CO, 'Argentina'->AR.
#   card_count                count(*) of bank.products rows for this
#                             customer_id where product_type in
#                             ('Tarjeta Crédito', 'Tarjeta Débito').
#   card_kinds                the distinct kinds among those same rows
#                             ('credit' for Tarjeta Crédito, 'debit' for
#                             Tarjeta Débito), as an unordered set.
#   blocked                   true iff any of those rows has
#                             product_status = 'Blocked'.
#   customer_status           bank.customers.customer_status, literal
#                             value (e.g. 'Suspended').
#   missing_income            true iff bank.customers.estimated_monthly_income
#                             is null.
#   repeat_complainer         true iff any bank.complaints row for this
#                             customer_id has is_repeat_complainer = true.
#   regulator_case            true iff any bank.complaints row for this
#                             customer_id has reception_channel = 'Regulator'.
#   recent_declines           a list of bank.transactions.response_code
#                             values; each must have a matching row for this
#                             customer_id with transaction_status =
#                             'Declined' and transaction_date within 30 days
#                             of app.system_metadata.load_date.
#   has_pending_transaction   true iff any bank.transactions row for this
#                             customer_id has transaction_status = 'Pending'.
#   has_reversed_transaction  true iff any bank.transactions row for this
#                             customer_id has transaction_status = 'Reversed'.
#   expiring_card             true iff any card product (Tarjeta
#                             Crédito/Débito) for this customer_id has
#                             expiration_date between
#                             app.system_metadata.load_date and load_date
#                             + 90 days.
#   usd_card                  true iff any card product for this
#                             customer_id has currency = 'USD'.
#
# T4/D17: `split: dev | heldout` is also a non-trait key, like
# `customer_id` and `notes` -- dev and held-out share no personas and no
# seeds. Every persona id referenced outside `eval/` (docs, backend tests,
# e2e, Makefile, README) is `dev`; the `heldout` personas below are new,
# found by the same predicates against `latam_golden`, so each side has
# >=1 persona for every `03` §8 category: each decline code (`05`/`14`/
# `51`/`54`), each country, multi-card, single-card, `blocked: true`,
# non-Active `customer_status`, `missing_income`, `regulator_case`,
# `has_pending_transaction`, `has_reversed_transaction` and
# `expiring_card`.
#
# Every `03` §8 category has at least one matching customer in `latam_golden`
# today; none is missing, so none is a "no match" placeholder.
