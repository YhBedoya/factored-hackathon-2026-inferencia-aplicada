# Dev overlay: hot reload for the backend, the Vite dev server (HMR) for the
# frontend, and the dev Nginx config that fronts both.
services:
  backend:
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend/app:/app/app

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ../frontend:/app
      # Anonymous volume: shadows the bind mount above so the container's own
      # `npm ci` install isn't overwritten by (or doesn't overwrite) whatever
      # is on the host at `frontend/node_modules`.
      - /app/node_modules
    command: sh -c "npm ci && npm run dev"
    healthcheck:
      # `curl` ships in the (non-slim) `node` image. `start_period` covers
      # the container's own `npm ci` (~6s cold, per T14 verify) plus Vite's
      # boot; a later failure only flips the reported health status, same as
      # the backend's (T5 repair).
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
