[project]
name = "card-support-backend"
version = "0.1.0"
description = "LATAM Bank card-support backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-aws>=0.2",
    "pydantic-settings>=2",
    "structlog>=24",
    "duckdb>=1",
    "pyyaml>=6",
    "babel>=2.16",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "import-linter>=2",
    "types-PyYAML",
    "streamlit>=1.38",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.domains.conversation.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["babel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
