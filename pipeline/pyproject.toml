[project]
name = "card-support-pipeline"
version = "0.1.0"
description = "Swip card-support data pipeline for the LATAM Bank dataset (S3 -> Parquet -> dbt-duckdb -> Postgres)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "psycopg[binary]>=3.2",
    "pandera[pandas]>=0.33.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
